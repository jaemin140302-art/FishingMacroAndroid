
plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.example.fishingmacro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.fishingmacro'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
